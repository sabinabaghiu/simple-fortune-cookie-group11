apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: sabinabaghiu/frontend:latest
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_HOST
              value: backend
            - name: BACKEND_PORT
              value: "9000"