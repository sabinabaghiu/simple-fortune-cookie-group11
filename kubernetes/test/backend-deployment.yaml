apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-test
  template:
    metadata:
      labels:
        app: backend-test
    spec:
      containers:
        - name: backend-test
          image: sabinabaghiu/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
          env:
            - name: REDIS_DNS
              value: redis-test